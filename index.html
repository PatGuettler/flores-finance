<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spend & Budget Tracker</title>
    <meta
      name="description"
      content="Parse credit card exports, auto-categorize spending, import budgets, and compare actuals to plan."
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var key = "spend-budget-user-settings";
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return;
          var s = JSON.parse(raw);
          var eff = "dark";
          if (s.theme === "light") eff = "light";
          else if (s.theme === "dark") eff = "dark";
          else if (s.theme === "system") {
            eff = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = eff;
          if (s.reducedMotion) document.documentElement.classList.add("reduce-motion");
          var root = document.getElementById("root");
          if (root && s.compactLayout) root.classList.add("compact");
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
